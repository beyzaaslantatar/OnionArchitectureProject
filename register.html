<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Register></title>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 1.5rem 0;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }
        .btn-primary {
            background: #764ba2;
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: #5a377d;
            transform: translateY(-2px);
        }
        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 8px;
        }
        .form-control:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 0.25rem rgba(118, 75, 162, 0.25);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark">Admin Panel</h3>
            <p class="text-muted small">Create a new account</p>
        </div>
        
        <div id="errorAlert" class="alert alert-danger d-none py-2 small text-center" role="alert"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label for="fullName" class="form-label text-secondary small fw-bold">Full Name</label>
                <input type="text" class="form-control" id="fullName" required placeholder="Ad Soyad">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label text-secondary small fw-bold">Email</label>
                <input type="email" class="form-control" id="email" required placeholder="örnek@gmail.com">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label text-secondary small fw-bold">Password</label>
                <input type="password" class="form-control" id="password" required placeholder="••••••">
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label text-secondary small fw-bold">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" required placeholder="••••••">
            </div>

            <button type="submit" class="btn btn-primary w-100 text-uppercase tracking-wide">Register</button>
        </form>

        <div class="text-center mt-3">
            <p class="text-muted small mb-0">
                Already have an account? 
                <a href="login.html" class="text-decoration-none fw-bold" style="color: #764ba2;">Log in</a>
            </p>
        </div>
    </div>

    <script type="module" src="register.js"></script>
</body>
</html>
